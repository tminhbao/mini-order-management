services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-order-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mini-order-management-db
    ports:
      - '5432:5432'
    volumes:
      - mini-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d mini-order-management-db']

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

volumes:
  mini-order-data:
  mini-order-redis-data: